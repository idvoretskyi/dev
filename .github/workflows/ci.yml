name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same-repo PRs have a writable token; fork PRs get a read-only token that
  # cannot upload SARIF. Computed once here and reused by every upload step
  # instead of repeating the same three-line condition in each job.
  UPLOAD_SARIF: >-
    ${{ github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Validate
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: .devcontainer/Dockerfile

      - name: Run gitleaks
        # To bump gitleaks:
        #   1. Find the latest release at
        #      https://github.com/gitleaks/gitleaks/releases/latest
        #   2. Download gitleaks_<version>_checksums.txt and copy the
        #      sha256 for gitleaks_<version>_linux_x64.tar.gz
        #   3. Update GITLEAKS_VERSION and GITLEAKS_SHA256 below.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks detect \
            --source . \
            --redact \
            --no-banner \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Upload gitleaks SARIF
        if: always() && env.UPLOAD_SARIF == 'true'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: gitleaks.sarif
          category: security-analysis/gitleaks

      - name: Build Docker image
        run: |
          docker build --pull -t "dev-template:${{ github.sha }}" .devcontainer/
          docker save "dev-template:${{ github.sha }}" -o /tmp/dev-template.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docker-image-${{ github.sha }}
          path: /tmp/dev-template.tar
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    name: Test Devcontainer
    needs: build
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test devcontainer functionality
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          push: never
          runCmd: |
            set -eu
            for cmd in python3 node npm gh opencode copilot curl jq claude; do
              if ! command -v "$cmd" >/dev/null 2>&1; then
                echo "::error::$cmd is missing"
                exit 1
              fi
              "$cmd" --version 2>&1 | head -1
            done

  scan:
    runs-on: ubuntu-latest
    name: Security and SBOM Analysis
    needs: build
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image-${{ github.sha }}
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/dev-template.tar

      - name: Run Trivy vulnerability scanner (image)
        id: trivy-image
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'dev-template:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL'
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: '1'
          cache: false

      - name: Upload Trivy image scan results
        if: always() && env.UPLOAD_SARIF == 'true'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'security-analysis/trivy-image'

      - name: Generate SBOM
        if: always()
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: 'dev-template:${{ github.sha }}'
          format: 'spdx-json'
          output-file: 'sbom.spdx.json'

      - name: Upload SBOM as artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 30

      - name: Run Trivy vulnerability scanner (filesystem)
        id: trivy-fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL'
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: '1'
          cache: false

      - name: Upload Trivy filesystem scan results
        if: always() && env.UPLOAD_SARIF == 'true'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'security-analysis/trivy-filesystem'

      - name: Fail job if any Trivy scan found CRITICAL vulnerabilities
        if: steps.trivy-image.outcome == 'failure' || steps.trivy-fs.outcome == 'failure'
        run: |
          echo "::error::Trivy found CRITICAL vulnerabilities. Review the Security tab for details."
          exit 1
